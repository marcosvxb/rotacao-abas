
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Rotação de Abas</title>
  <style>
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<iframe id="rotator" src=""></iframe>

<script>
  const paginas = [
    "https://www.google.com",
    "https://www.bing.com",
    "https://www.uol.com.br"
  ];

  let indice = 0;
  const tempo = 10000;

  function trocarPagina() {
    document.getElementById("rotator").src = paginas[indice];
    indice = (indice + 1) % paginas.length;
  }

  trocarPagina();
  setInterval(trocarPagina, tempo);
</script>

</body>
</html>
